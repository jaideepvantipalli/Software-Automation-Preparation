<!DOCTYPE html>
<html>
<head>
    <title>Selenium Practice</title>
</head>

<body>

<h1>Login Page</h1>

<form>

    <input
            type="text"
            id="username"
            name="user"
            placeholder="Enter username">

    <br><br>

    <input
            type="password"
            id="password"
            name="pass"
            placeholder="Enter password">

    <br><br>

    <button id="loginBtn" type="button">
        Login
    </button>

    <br><br>

    <a href="https://www.google.com">
        Forgot Password?
    </a>

</form>

</body>
</html>
