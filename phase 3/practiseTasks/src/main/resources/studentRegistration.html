<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>
</head>

<body>

<h2 id="heading">Student Registration Form</h2>

<form id="registrationForm">

    <label>Name:</label>
    <input type="text"
           id="username"
           name="username"
           placeholder="Enter name">

    <br><br>

    <label>Email:</label>
    <input type="email"
           id="email"
           value="old@gmail.com">

    <br><br>

    <label>Password:</label>
    <input type="password"
           id="password">

    <br><br>

    <label>Gender:</label>

    <input type="radio"
           name="gender"
           id="male"
           value="Male">
    Male

    <input type="radio"
           name="gender"
           id="female"
           value="Female">
    Female

    <br><br>

    <input type="checkbox"
           id="terms">
    Accept Terms and Conditions

    <br><br>

    <button type="button"
            id="registerBtn">
        Register
    </button>

    <p id="message"></p>

</form>

<script>

    document.getElementById("registerBtn")
        .addEventListener("click", function() {

            document.getElementById("message")
                .innerText = "Registration Successful!";

        });

</script>

</body>
</html>
