<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>registration</title>
</head>
<body>
<div id="registration">

    <h2>Student Registration</h2>

    <input type="text"
           id="studentName"
           name="name"
           class="form-control">

    <input type="email"
           id="studentEmail"
           name="email"
           class="form-control">

    <input type="password"
           id="studentPassword"
           name="password">

    <button id="registerBtn"
            class="btn primary">
        Register
    </button>

    <a href="/login">Already registered? Login</a>
</div>
</body>
</html>
